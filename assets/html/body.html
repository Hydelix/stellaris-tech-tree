<ul class="float-Holder">
  <li class="float-Element float-Highlight float-All">
    <a data-scroll='top' class="float-Contents">
      <h2>All <img src="../assets/icons/research_icon.png" class="float-Image"> </h2>
    </a>
  </li>
  <li class="float-Element float-Lowlight float-Physics">
    <a data-scroll='top' class="float-Contents">
      <h2>Physics <img src="../assets/icons/physics_research.png" class="float-Image"> </h2>
    </a>
  </li>
  <li class="float-Element float-Lowlight float-Society">
    <a data-scroll='top' class="float-Contents">
      <h2>Society <img src="../assets/icons/society_research.png" class="float-Image"> </h2>
    </a>
  </li>
  <li class="float-Element float-Lowlight float-Engineering">
    <a data-scroll='top' class="float-Contents">
      <h2>Engineering <img src="../assets/icons/engineering_research.png" class="float-Image"> </h2>
    </a>
  </li>
  <li class="float-Element float-Lowlight float-Anomalies">
    <a class="float-Contents">
      <h2>Events <img src="../assets/icons/event.png" class="float-Image"> </h2>
    </a>
  </li>
  <li class="float-Element float-Lowlight float-Search">
    <input id="deepsearch" type="search" placeholder="Search techs" aria-label="Search techs">
    <button type="button" id="search-prev" class="search-nav" title="Previous result (Shift+Enter)" aria-label="Previous result" disabled><svg viewBox="0 0 10 6" width="10" height="6" aria-hidden="true"><path d="M1 5l4-4 4 4" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button>
    <button type="button" id="search-next" class="search-nav" title="Next result (Enter)" aria-label="Next result" disabled><svg viewBox="0 0 10 6" width="10" height="6" aria-hidden="true"><path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button>
    <span id="search-count" aria-live="polite"></span>
  </li>
  <li class="float-Info"><span id="version-label"></span><span id="progress" aria-live="polite"></span></li>
  <li class="float-RightElement float-RightBuffer">
    <a href="../index.html?menu" class="float-RightContents">
      <h2><img src="../assets/icons/back_button.png" class="float-RightImage"> Back</h2>
    </a>
  </li>
  <li class="float-RightElement">
    <a data-scroll='top' class="float-RightContents">
      <h2><img src="../assets/icons/up_to_top.png" class="float-RightImage"> Top</h2>
    </a>
  </li>
  <li class="float-RightElement float-Research research hide">
    <span id="preset_label" class="rlabel">Researched Presets</span>
    <div id="preset_dd" class="dd">
      <select id="research_selection" class="sr-only" tabindex="-1" aria-hidden="true"></select>
      <button type="button" id="preset_btn" class="dd-btn" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="preset_label preset_btn">
        <span class="dd-text">Add New Preset</span>
        <svg class="dd-caret" viewBox="0 0 10 6" width="10" height="6" aria-hidden="true"><path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
      </button>
      <ul id="preset_menu" class="dd-menu" role="listbox" tabindex="-1" aria-labelledby="preset_label" hidden></ul>
    </div>
    <button type="button" id="research_load" class="rbtn" title="Load the selected preset" disabled>Load</button>
    <button type="button" id="research_save" class="rbtn" title="Save your progress to the selected preset, or choose Add New Preset to create one">Save</button>
    <button type="button" id="research_remove" class="rbtn rbtn-icon danger" title="Delete the selected preset" aria-label="Delete selected preset" disabled>
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
    </button>
  </li>
</ul>
<div id="tech-tree" style="margin-top:50px">
  <div id="tech-tree-physics">

  </div>
  <div id="tech-tree-society">

  </div>
  <div id="tech-tree-engineering">

  </div>
  <div id="tech-tree-anomalies" class="float-NoDisplay">

  </div>
</div>
